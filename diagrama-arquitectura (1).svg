<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Arquitectura — Gestión de Usuarios</text>

  <!-- Cliente -->
  <rect x="60" y="90" width="200" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="125" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Cliente</text>
  <text x="160" y="148" font-size="12" text-anchor="middle" fill="#444444">Navegador / Postman / curl</text>

  <line x1="260" y1="135" x2="360" y2="135" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="122" font-size="11" text-anchor="middle" fill="#555555">HTTP :3000 (host)</text>

  <!-- Docker network box -->
  <rect x="360" y="60" width="480" height="340" rx="12" fill="#f5f5f5" stroke="#999999" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="600" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#555555">docker-compose (red interna de Docker)</text>

  <!-- App container -->
  <rect x="400" y="110" width="200" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="140" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Contenedor "app"</text>
  <text x="500" y="162" font-size="12" text-anchor="middle" fill="#444444">Node.js + Express</text>
  <text x="500" y="180" font-size="12" text-anchor="middle" fill="#444444">/users (CRUD) — src/</text>
  <text x="500" y="198" font-size="11" text-anchor="middle" fill="#777777">escucha en :5050 (interno)</text>

  <line x1="500" y1="220" x2="500" y2="270" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="248" font-size="11" text-anchor="middle" fill="#555555">TCP :5432 (host: db)</text>

  <!-- DB container -->
  <rect x="400" y="270" width="200" height="110" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="300" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Contenedor "db"</text>
  <text x="500" y="322" font-size="12" text-anchor="middle" fill="#444444">postgres:16-alpine</text>
  <text x="500" y="340" font-size="12" text-anchor="middle" fill="#444444">tabla usuarios (init.sql)</text>
  <text x="500" y="358" font-size="11" text-anchor="middle" fill="#777777">volumen db_data</text>

  <!-- .env note -->
  <rect x="660" y="150" width="140" height="70" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="175" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">.env</text>
  <text x="730" y="192" font-size="10" text-anchor="middle" fill="#92400e">credenciales y</text>
  <text x="730" y="205" font-size="10" text-anchor="middle" fill="#92400e">config compartida</text>

  <line x1="660" y1="185" x2="600" y2="165" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
